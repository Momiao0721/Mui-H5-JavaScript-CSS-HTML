<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">跨界传参Dome</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view" id="LianXiDad">
				
				<li class="mui-table-view-cell mui-media" XiangQungID=''>
						<img style="height: 200px; width: 100%;" src="">
						<div class="mui-media-body">
							<h4>1</h4>
							<h5>1</h5>
							<h5>1</h5>
							<p class="mui-ellipsis">1</p>
						</div>
				<hr >
				<p>人类:<button type="button" style="position: absolute;right: 0;" class="mui-btn mui-btn-red">按钮</button></p>
				</li>
				
				
			</ul>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function LieBiaoYei(){
					mui.ajax(API_BASE + '/api/projects/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var Lbiao = '';
								for (var i = 0 ; i < data.rows.length ; i++) {

								Lbiao += `<li class="mui-table-view-cell mui-media" XiangQungID='${data.rows[i].id}'>
						<img style="height: 200px; width: 100%;" src="${API_BASE + data.rows[i].imgUrl}">
						<div class="mui-media-body">
							<h4>${data.rows[i].projectTitle}</h4>
							<h5>${data.rows[i].receivingInstitution}</h5>
							<h5>${data.rows[i].onLineDay}</h5>
							<p class="mui-ellipsis">${data.rows[i].introduce}</p>
						</div>
				<hr >
				<p>人类:${data.rows[i].feedbackNum}<button type="button" class="mui-btn mui-btn-red" style="position: absolute;right: 10%;">按钮</button></p>
				</li>`

								}
								document.getElementById('LianXiDad').innerHTML = Lbiao

								var YeiMianlist = document.querySelectorAll('#LianXiDad .mui-media')
								for (var j = 0 ; j < YeiMianlist.length ; j++) {
										(function(NeiRong){
											NeiRong.addEventListener('tap',function(){
												var id = this.getAttribute('XiangQungID')
												mui.openWindow('LianXi1XiangQheng.html',{
													extras:{id:id}
												})
											})
										})(YeiMianlist[j])
								}
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});
				}
				LieBiaoYei()
			})
		</script>
	</body>

</html>
