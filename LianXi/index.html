<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	<div class="mui-content">
		
		<form class="mui-input-group">
			<div class="mui-input-row">
				<label>账号</label>
				<input type="text" class="mui-input-clear" placeholder="请输入账号" id="username">
			</div>
		
			<div class="mui-input-row">
				<label>密码</label>
				<input type="password" class="mui-input-password" placeholder="请输入密码" id="password">
			</div>
		</form>
		
		<div id="but">
			<button id="butt" type="button" class="mui-btn mui-btn-blue mui-btn-block">登录</button>
		</div>
		
	</div>
	<script src="./js/http.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			mui('#but').on('tap','#butt',function(){
				var username = document.getElementById('username').value;
				var password = document.getElementById('password').value;
				if (username == '' || password == '') {
					mui.alert('账号/密码不能为空')
				}else{
					mui.ajax(API_BASE + '/api/login',{
						data:{
							username:username,
							password:password
						},
						headers:{

							'Content-Type':'application/json'
						},

						dataType:'json',
						type:'post',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								mui.toast('欢迎' + username + '登录成功')
								localStorage.setItem('token',data.token)
								mui.openWindow({
									url:'./exe/page.html'
								});
							}else{
								mui.toast('账号/密码错误')

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});
				}
			})

		})
    </script>
</body>
</html>
