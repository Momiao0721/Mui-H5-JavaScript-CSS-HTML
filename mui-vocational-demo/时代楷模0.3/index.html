<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
	<script src="js/http.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<h1 class="mui-title">登录—手机号</h1>
	</header>
	<div class="mui-content">
		
		
		<form class="mui-input-group">
			<div class="mui-input-row">
				<label>手机号</label>
				<input type="text" class="mui-input-clear" placeholder="请输入手机号" id="phone">
			</div>
		</form>
		
		<form class="mui-input-group">
			<div class="mui-input-row">
				<label>密码</label>
				<input type="password" class="mui-input-password" placeholder="请输入密码" id="password">
			</div>
		</form>
		
		<div id="but">
			<button type="button" class="mui-btn mui-btn-blue mui-btn-block" id="butt">登录</button>
		</div>
		
	</div>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {
		  
			mui('#but').on('tap','#butt',function(){
				
				var phone = document.getElementById('phone').value;
				var password = document.getElementById('password').value
				
				if (phone == '' || password == '') {
					mui.alert('账号/密码不能为空')
				} else{
					mui.ajax(http + '/api/phone/login',{
						data:{
							phone:phone,
							password:password
						},
						headers:{
							'Content-Type':'application/json'
						},
						
						dataType:'json',//服务器返回json格式数据
						type:'post',//HTTP请求类型
						timeout:10000,//超时时间设置为10秒；
						success:function(data){
							if(data.code == 200){
								
								mui.toast('欢迎' + phone + '登录成功')
								localStorage.setItem('token',data.token)
								mui.openWindow({
									url:'./exe/page.html'
								})
								
							}else{
								mui.toast('账号/密码错误')
							}
						},
						error:function(xhr,type,errorThrown){
							
						}
					});
				}
				
			})
			
			
		})
    </script>
</body>
</html>
