		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			    
				function Lsit(){
					
				mui.ajax(http + '/api/around/list',{
					data:{
						
					},
					'Content-Type':'application/json',
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(data){
						console.log (JSON.stringify(data))
						if (data.code == 200) {
							
							var listHTML = '';
							
							for (var i = 0 ; i < data.rows.length ; i++) {
							listHTML += `<li TiaoZuanID = "${data.rows[i].id}" class="mui-table-view-cell mui-col-xs-6 mui-media" style="float: left;">
					<img src="${httpimg + data.rows[i].imgUrl}" style="height: 100px; width: 100%;">
					<h4 class="mui-ellipsis">${data.rows[i].title}</h4>
					<h5>${data.rows[i].name}</h5>
					<p class="mui-ellipsis">${data.rows[i].content}</p>
				 </li>`
							}
							document.getElementById('list').innerHTML = listHTML;
							var XiangQingList = document.querySelectorAll('#list .mui-media')
							
							for (var j = 0 ; j < XiangQingList.length ; j++) {
								
								(function(XiangQing){
									XiangQing.addEventListener('tap',function(){
										
										var id = this.getAttribute('TiaoZuanID')
										
										console.log(id)
										
										if(!id)return;
										
										plus.storage.setItem('TiaoZuanID',id)
										
										mui.openWindow('YingXungHTML.html',{
											extras:{
												id:id
											}
										})
										
									})
								})(XiangQingList[j])
								
							}
							
						}
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				}
				Lsit()
			})
		</script>
