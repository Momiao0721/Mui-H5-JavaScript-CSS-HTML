<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<!-- 引入 mui 的样式文件 -->
		<link href="../css/mui.css" rel="stylesheet" />
		<style type="text/css">
			* {
				touch-action: pan-y;
				/* 只允许纵向手势，避免横向滑动和页面滚动打架 */
			}
			.mui-input-row label {
			    width: 20%;
				/* border: 1px solid #AAAAAA; */
			}
			/* 输入框 / 文本域占 80% 宽，加边框和圆角 */
			.mui-input-row label ~ input, .mui-input-row label ~ textarea {
			    width: 80%;
				border: 1px solid #cccccc;
				border-radius: 5px;
				margin-top: 5px;
			}
		</style>
	</head>

	<body>

		<!-- 顶部导航栏 -->
		<header class="mui-bar mui-bar-nav">
			<!-- mui-action-back：mui 自带返回按钮，点一下关闭本页回到上一页 -->
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<!-- 本页标题：说明这是"添加笔记"的子页面 -->
			<h1 class="mui-title">添加笔记</h1>
		</header>

		<!-- mui-content：页面主体内容区 -->
		<div class="mui-content">
			<div class="mui-card">

				<div class="mui-card-content" style="height: 200px;width: 100%;">
					<!-- 标题输入行 -->
					<div class="mui-input-row">
						<label>标题</label>
						<!-- id="title"：后面用 getElementById('title') 取用户输入的值 -->
						<input type="text" id="title" class="mui-input-clear" placeholder="请输入标题">
					</div>
					<!-- 内容输入行 -->
					<div class="mui-input-row">
						<label>内容</label>
						<!-- id="content"：后面用 getElementById('content') 取用户输入的值 -->
						<textarea rows="6" cols="" id="content"></textarea>
					</div>
				</div>

				<!-- 提交按钮的容器：id="tj"，事件委托绑在它身上 -->
				<div id="tj" class="mui-card-footer">
					<a class="mui-card-link" style="margin: -10px auto;">提交</a>
				</div>
			</div>
		</div>

		<script src="../js/http.js"></script>
		<!-- http.js 里定义了 http（接口地址前缀）和 httpimg（图片前缀） -->
		<script src="../js/mui.min.js"></script>
		<script type="text/javascript">

			// mui.init()：初始化 mui
			mui.init({
				// beforeback：本页面"返回之前"触发的钩子
				beforeback:function () {
					// currentWebview()：当前这个页面的 webview
					// .opener()：谁打开的我 → 父页面 xd.html
					var v=plus.webview.currentWebview().opener();
					// mui.fire(目标页面, '自定义事件名')：朝父页面发一个 refresh 事件
					// 父页面监听到 refresh 后就会重新加载列表，把新笔记显示出来
					mui.fire(v,'refresh');
					// 返回 true：允许继续执行"关闭本页"的默认动作
					return true;
				}
			})
			
			// plusReady：H5+ 环境准备好后执行（用到 plus.xxx 必须写在这里面）
			mui.plusReady(function () {

			    // 事件委托：在 #tj 容器里，点到 .mui-card-link 才触发
			    mui('#tj').on('tap','.mui-card-link',function(){
			      // console.log('你点击了提交按钮');

				  // 取用户填写的标题和内容
				  var title = document.getElementById('title').value;
				  var content = document.getElementById('content').value;

				  // 【父子传参的关键】取出父页面传过来的学习历史 id
				  // 父页面是用 mui.openWindow('addBJ.html','addBJ',{extras:{xxLsId:xxLsId}}) 传的，
				  // extras 里的字段会自动挂到本页 webview 对象上，所以这样就能取到
				  var lsId = plus.webview.currentWebview().xxLsId;
				  // console.log(title+content);
				  
				  // 对标题和内容判空
				  
				  // 发送请求：为这条学习历史添加笔记
				  mui.ajax(http + '/api/history/note',{
				  	// data：要提交给后端的参数
				  	data:{
				  		noteTitle:title,
						noteContent:content,
						// studyHistoryId：把笔记挂到"哪条学习历史"下面（就是父页面传来的 xxLsId）
						studyHistoryId:lsId
				  	},
					headers:{
						// 【关键】POST 必须声明 json，否则后端报 Content type 不支持
						'Content-Type':'application/json',
						// 登录令牌
						'Authorization':localStorage.getItem('token')
						
					},
				  	dataType:'json',//服务器返回json格式数据
				  	type:'post',//HTTP请求类型
				  	timeout:10000,//超时时间设置为10秒；
				  	success:function(data){
				  		// console.log(data.code);
						// mui.toast  ('新增成功');
						// 弹出提示
						mui.alert('新增成功');
						// 返回上一页（会触发 beforeback → 通知父页面刷新）
						mui.back();
						// 有BUG
						// mui.openWindow('xd.html/#item2')
				  	},
				  	error:function(xhr,type,errorThrown){
				  		
				  	}
				  });
			    }) 
			})
			
		</script>
	</body>

</html>
