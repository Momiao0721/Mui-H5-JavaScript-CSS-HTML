				function GongYihuoDongJS(){
					
				mui.ajax(http + '/api/activity/list',{
					data:{
						
					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(data){
						if(data.code == 200){
							var GongYiHuoDingHTML = ''
							
							for (var i = 0 ; i < data.rows.length ; i++) {
								
								GongYiHuoDingHTML += `<li style="padding: 5px;">
						<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
						<div class="mui-media-body">
							<h4>${data.rows[i].activityName}</h4>
							<h5>${data.rows[i].startEndTime}</h5>
							<p class="mui-ellipsis">${data.rows[i].briefIntroduction}</p>
						</div>
						<hr >
						<p style="color: #000000;">人类:${data.rows[i].applyNum}
						<button type="button" BaiMOngID="${data.rows[i].id}" class="mui-btn mui-btn-red mui-media" style="position: absolute;right: 5%; border-radius: 30px;">报名</button>
						</p>
				</li>`
								
							}
							document.getElementById('Gyhd').innerHTML = GongYiHuoDingHTML;
							
							var BaoMingList = document.querySelectorAll('#Gyhd .mui-media')
							
							for (var j = 0 ; j < BaoMingList.length ; j++) {
								
								(function(BaoMingXiangQing){
									BaoMingXiangQing.addEventListener('tap',function(){
										
										var id = this.getAttribute('BaiMOngID')
										
										console.log(id)
										
										if(!id)return;
										
										plus.storage.setItem('BaiMOngID',id)
										mui.openWindow('BaoMIngXiangQingHTML.html',{
											extras:{
												id:id
											}
										})
										
									})
								})(BaoMingList[j])
								
							}
							
						}
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				}
				GongYihuoDongJS()
