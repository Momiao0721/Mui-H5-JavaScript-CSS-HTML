<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">数据分析</h1>
		</header>
		<div class="mui-content">
			
			<div id="TiaoXingTu" style="width: 100%; height: 200px;"></div>
			<div id="ZeiXianTu" style="width: 100%; height: 200px;"></div>
			<div id="BingTu" style="width: 100%; height: 200px;"></div>
			
		</div>
		<script src="../js/echarts.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			  
				var TiaoXinng = echarts.init(document.getElementById('TiaoXingTu'));
				var ZeiXian = echarts.init(document.getElementById('ZeiXianTu'))
				var Bing = echarts.init(document.getElementById('BingTu'))
				
				mui.ajax(http + '/api/data/comment/list_2',{
					data:{
						
					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(res){
						if (res.code == 200) {
							
							var d = res.data;
							
							var xAxis = d.name
							
							var Data1 = d.woman
							
							var Data2 = d.man
							
							// 柱状图基础配置
							var lineOption = {
							    color:['#62c8ff','#ff6068'],//柱状图颜色
							    legend: { // 展示系列的标记
							        data: ['女性评论数统计', '男性评论数统计'],
							        left:"center",
							    },
							    grid:{  
							        show:true
							    },
							    xAxis: {
							        type: 'category',
							        data: xAxis,
							        splitLine:{ show: true }, //x轴网格线
							    },
							    yAxis: {
							        type: 'value',
							        min:0,
							    },
								
							    series: [{
							        name: '女性评论数统计',
							        data: Data1,//柱状图1的y轴数据
							        type: 'bar'
							    },
							    {
							        name: '男性评论数统计',
							        data: Data2,//柱状图2的y轴数据
							        type: 'bar'
							    }
							  ]
							}
							
						}
						TiaoXinng.setOption(lineOption)
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				
				
				mui.ajax(http + '/api/read/book/list_1',{
					data:{
						
					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(res){
						
						if(res.code == 200){
							
						
						var d = res.data;
						
						var xLineData = d.name;
						
						var YData = d.value;
						
						// 折线图基础配置
						var lineOption = {
						    color:["#49aa60"],
						    legend:{
						        data:['所有用户阅读书籍数量变化趋势'],
						        left: 'center',
						    },
						    xAxis: {
						        splitLine: { 
						            show: true
						        },
						        type: 'category',
						        data: xLineData
						    },
						    yAxis: {
						        min: 0,// 最小值
						        type: 'value'
						    },
						    series: [{
						        name:'所有用户阅读书籍数量变化趋势',
						        data: YData,// y轴坐标
						        type: 'line'
						    },
							]
						}
						}
						ZeiXian.setOption(lineOption)
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				
				mui.ajax(http + '',{
					data:{
						
					},
					dataType:'json',//服务器返回json格式数据
					type:'post',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(data){
						
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				
				mui.ajax(http + '/api/read/book/list/type_1',{
					data:{
						
					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(res){
						if(res.code == 200){
							
							var d = res.data;
							
							var BingBIng = []
							
							for (var i = 0 ; i < d.name.length ; i++) {
								
								BingBIng.push({
									value: d.count[i],
									name: d.name[i]
								})
								
							}
							
							var pieOption = {
							    color:['red','green','#a4aaaa','#aa4b1f','#aa8f78','#95aa83'],
							    tooltip: {
							        trigger: 'item'
							    },
							    legend: {
							        bottom: '0',
							        left: 'center',
							        icon:'circle',
							    },
							    series: [{
							        type: 'pie',
							        radius: '45%',// 饼图半径
							        label: {
							                show: true,
							                formatter: '{d}%',// 显示格式
							        },
							        data: BingBIng
							        }
							    
								]
							}
							
							Bing.setOption(pieOption)
							
						}
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				
				
			})
		</script>
	</body>

</html>
