<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">英雄列表</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view" id="kmlbList">
				
				<!-- <li class="mui-table-view-cell mui-media">
					<a href="javascript:;">
						<img class="mui-media-object mui-pull-left" src="">
						<div class="mui-media-body">
							<h5 style="color: #000000;">123</h5>
							<h6>123</h6>
							<h6>23</h6>
							<p class="mui-ellipsis">能和心爱的人一起睡觉，是件幸福的事情；可是，打呼噜怎么办？</p>
						</div>
					</a>
				</li> -->
				
				
				
			</ul>
			
		</div>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			    
				function kaiMoList(){
					
					mui.ajax(http + '/api/hero/list',{
						data:{
							
						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},
						
						dataType:'json',//服务器返回json格式数据
						type:'get',//HTTP请求类型
						timeout:10000,//超时时间设置为10秒；
						success:function(data){
							if(data.code == 200){
								
								var html = '';
								for(var i = 0 ; i < data.rows.length ; i++){
									
									if (i % 2 == 0){
										
										html += `<li class="mui-table-view-cell mui-media" TiaoZuanID="${data.rows[i].id}">

						<img class="mui-media-object mui-pull-left" src="${httpimg + data.rows[i].imgUrl}">
						<div class="mui-media-body">
							<h5 style="color: #000000;">${data.rows[i].name}</h5>
							<h6>${data.rows[i].createTime}</h6>
							<h6>${data.rows[i].title}</h6>
							<p class="mui-ellipsis">${data.rows[i].introduction}</p>
						</div>

				</li>`
									}else{
										html +=
										`<li class="mui-table-view-cell mui-media" TiaoZuanID="${data.rows[i].id}">
												<img class="mui-media-object mui-pull-right" src="${httpimg + data.rows[i].imgUrl}">
												<div class="mui-media-body">
													<h5 style="color: #000000;">${data.rows[i].name}</h5>
													<h6>${data.rows[i].createTime}</h6>
													<h6>${data.rows[i].title}</h6>
													<p class="mui-ellipsis">${data.rows[i].introduction}</p>
												</div>
										</li>`
									}
									
								}
										document.getElementById('kmlbList').innerHTML = html
										var XiangQingList = document.querySelectorAll('#kmlbList .mui-media')
										
										for(var j = 0 ; j < XiangQingList.length ; j++){
											(function(XiangQing){
												XiangQing.addEventListener('tap',function(){
													var id = this.getAttribute('TiaoZuanID')
													console.log(id)
													if(!id)return;
													
													plus.storage.setItem('TiaoZuanID',id)
													mui.openWindow('YingXingListHTML.html',{
														extras:{
															id:id
														}
													})
												})
											})(XiangQingList[j])
										}
							}
						},
						error:function(xhr,type,errorThrown){
							
						}
					});
					
				}
				kaiMoList()
				
				
				
			})
		</script>
	</body>

</html>
