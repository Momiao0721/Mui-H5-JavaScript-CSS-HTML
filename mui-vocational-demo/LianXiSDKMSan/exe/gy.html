<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">公益</h1>
		</header>
		<div class="mui-content">
			
			<div style="padding: 10px;">
				<div id="GongYI">
					
					
					
				</div>
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function GongYiMian(){

					mui.ajax(http + '/api/activity/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},
						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								var GongYiMianHTML = '';
								for (var i = 0 ; i < data.rows.length ; i++) {
									GongYiMianHTML += `<div style="padding: 5px; border-radius: 20px; background-color: #CCCCCC;">
						<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%; border-radius: 10px;">
						<div style="padding: 5px;">
							<h4>${data.rows[i].activityName}</h4>
							<h5 style="color: #000000;">${data.rows[i].startEndTime}</h5>
							<h5 style="color: #000000;">${data.rows[i].briefIntroduction}</h5>
							<hr >
							<div style="padding: 5px;">
								人数:${data.rows[i].applyNum}
								<button BaoMingID="${data.rows[i].id}" type="button" class="mui-btn mui-btn-red mui-media" style="position: absolute;right: 6%; border-radius: 10px;">报名</button>
							</div>
						</div>
					</div>
					<br>
					`
								}
								document.getElementById('GongYI').innerHTML = GongYiMianHTML
								var GonYiList = document.querySelectorAll('#GongYI .mui-media')

								for (var i = 0 ; i < GonYiList.length ;i++) {
									(function(YeiMian){
										YeiMian.addEventListener('tap',function(){

											var id = this.getAttribute('BaoMingID')

											console.log(id)

											plus.storage.setItem('BaoMingID',id);

											mui.openWindow({
												url:'BaoMingXiangQing.html',
												id:'BaoMingXiangQing',
												extras:{
													id:id
												}
											})
										})
									})(GonYiList[i])
								}
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				GongYiMian()
			})
		</script>
	</body>

</html>
