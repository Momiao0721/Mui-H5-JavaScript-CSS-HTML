<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">练习</h1>
		</header>
		<div class="mui-content">
			
			<div style="padding: 5px;">
				<div id="LianXiSan">
					
					
						
						
							
							
						</div>
					</div>
					<br>
					
				</div>
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var id = localStorage.getItem('userId') || 1

				function San(){

					mui.ajax(http + '/api/history/list',{
						data:{
							userId:id
						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								var BiJiHTML = '';
								for (var i = 0 ; i < data.rows.length ;i++) {
								var row = data.rows[i]

									BiJiHTML += `<div style="padding: 10px; background-color: #aaffff; border-radius: 10px;">
						<div >
							<p style="position: absolute;right: 5%;">标题${data.rows[i].status}</p>
							<p>时间:${data.rows[i].issueTime}</p>
						</div>`
									BiJiHTML += `<hr >
						<h4>内容:${data.rows[i].content}</h4>`

								if(row.wstudyNote){
									BiJiHTML += `<div style="padding: 10px; background-color: #e1cfc6; border-radius: 10px;">
							<h5 style="color: #000000;">${row.wstudyNote.noteContent}</h5>
							<hr >`

									BiJiHTML += `<button type="button" class="mui-btn mui-btn-red" SanCu-LsID="${data.rows[i].id}" SanCu-BiJIID="${row.wstudyNote.wstudyNote}">删除</button>
							<button type="button" class="mui-btn mui-btn-red">更改</button>`
								}else{

									BiJiHTML += `<div style="padding: 10px; background-color: #e1cfc6; border-radius: 10px;">
									<h5 style="color: #000000;">没有笔记</h5>
									<hr >`

											BiJiHTML += `<button type="button" class="mui-btn mui-btn-red">添加</button>`

								}

								BiJiHTML += `</div>
					</div>
					<br>`

								document.getElementById('LianXiSan').innerHTML = BiJiHTML
								var SanCuJiYiLSid = document.querySelectorAll('#LianXiSan .SanCu-LsID')
								var SanCuJiYiBiJIID = document.querySelectorAll('#LianXiSan .SanCu-BiJIID')

								}
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				San()
			})
		</script>
	</body>

</html>
