<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">报名页</h1>
		</header>
		
		<div class="mui-content">
			
			<div id="BaoMingYei" style="padding: 10px;">
				
			</div>
			
		</div>
		
		<nav class="mui-bar mui-bar-tab" id="Xia">
			
		</nav>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().BaoMingID || {}
				var id = plus.storage.getItem('BaoMingID') || BaoMingID.id

				console.log(id)

				function XiangXi(){

					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {

								var BaoMIngXiangXiHTML = ''

								BaoMIngXiangXiHTML += `<div id="" style="background-color: #CCCCCC; border-radius: 30px;">

					<img src="${httpimg + data.data.imgUrl}" style="height: 200px; width: 100%; padding: 7px; border-radius: 30px;">

					<div id="" style="padding: 7px;">
						<h4>${data.data.activityName}</h4>
						<h5 style="color: #000000;">${data.data.startEndTime}</h5>
						<h5 style="color: #000000;">${data.data.initiator}</h5>
					</div>

				</div>
				<br>
				<div id="" style="border-radius: 30px; background-color: #ACACB4; padding: 7px;">
					<p style="color: #000000;">活动详情:${data.data.activityDetail}</p>
				</div>`

								document.getElementById('BaoMingYei').innerHTML = BaoMIngXiangXiHTML

							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				XiangXi()

				function XiaMing(){

					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {

								var XiaHTML = ''

								var BaoMIngJiYi = localStorage.getItem('BaoMing_JiYI' + id )

								XiaHTML += `人数:${data.data.applyNum}
			<button type="button" class="mui-btn mui-btn-red mui-media ${BaoMIngJiYi ? 'mui-disabled':''}" id="BaoMing" style="position: absolute;right: 0%; width: 50%;">报名</button>`

								document.getElementById('Xia').innerHTML = XiaHTML;

								document.getElementById('BaoMing').addEventListener('tap',function(){

									mui.confirm('message','title',['取消','确认'],function (e) {
										if (e.index == 1) {
											mui.ajax(http + '/api/activity/apply',{
												data:{
													activityId:id
												},
												headers:{
													'Content-Type':'application/json',
													'Authorization':localStorage.getItem('token')
												},

												dataType:'json',
												type:'post',
												timeout:10000,
												success:function(data){

													if (data.code == 200) {
														mui.toast('更新成功')
														XiaMing()
														localStorage.setItem('BaoMing_JiYI' + id , 1)
													}else{
														mui.toast('报名失败')
													}

												},
												error:function(xhr,type,errorThrown){

												}
											});
										} else{
											mui.toast('你点击取消')
										}
									},'div')

								})

							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				XiaMing()
			})
		</script>
	</body>

</html>
