		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			    
				function gy(){
					
					mui.ajax(http + '/api/public/projects/list',{
						data:{
							
						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},
						
						dataType:'json',//服务器返回json格式数据
						type:'get',//HTTP请求类型
						timeout:10000,//超时时间设置为10秒；
						success:function(data){
							if (data.code == 200) {
								var gyHTML = '';
								for (var i = 0 ; i < data.rows.length ; i++) {
									
								gyHTML += `<div style="position: relative;top: 20px;" class="mui-content">
			<div style="border-radius: 20px;" class="mui-card">
				<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
				<div style="position: relative;left: 10px;">
					
				<h4>${data.rows[i].projectTitle}</h4>
				<p>${data.rows[i].onLineDay}</p>
				<p>${data.rows[i].receivingInstitution}</p>
				<p class="mui-ellipsis">${data.rows[i].introduce}</p>
				
				</div>
				<hr >
				<div style="position: relative;left: 10px;">
					报名人数:${data.rows[i].feedbackNum}
					<button type="button" class="mui-btn mui-btn-red" style="position: relative;left: 260px;bottom: 3px;" YeiMianID = "${data.rows[i].id}">报名</button>
				</div>
			</div>
		</div>
		`
								}
								document.getElementById('gy').innerHTML = gyHTML
							}
						},
						error:function(xhr,type,errorThrown){
							
						}
					});
					
				}
				gy()
			})
		</script>
