		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			    
				function xxls(){
					
				mui.ajax(http + '/api/history/list',{
					data:{
						
					}, 
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
					
					dataType:'json',//服务器返回json格式数据
					type:'get',//HTTP请求类型
					timeout:10000,//超时时间设置为10秒；
					success:function(data){
						if (data.code == 200) {
							var lsHTML = '';
							for (var i = 0 ; i < data.rows.length; i++) {
								
							lsHTML += `<li class="mui-table-view-cell" style="padding:10px;">
  <div class="mui-card" style="margin:0;border-radius:20px;">
    <div class="mui-card-content" style="padding:10px 12px;">
      <h4 style="margin:0 0 6px;">${data.rows[i].title}</h4>
      <p class="mui-ellipsis" style="margin:0;">${data.rows[i].content}</p>
    </div>
  </div>
</li>`
							
							}
							document.getElementById('ls').innerHTML = lsHTML;
						}
					},
					error:function(xhr,type,errorThrown){
						
					}
				});
				}
				xxls()
			})
		</script>
	</body>
