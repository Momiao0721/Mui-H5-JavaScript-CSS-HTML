<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">编辑页</h1>
		</header>
		<div class="mui-content">
			
			
			<div id="">
				请输入标题
				<textarea rows="" id="noteTitle"></textarea>
			
				请输入内容
				<textarea rows="" id="noteContent"></textarea>
			</div>
			
			<button type="button" class="mui-btn mui-btn-blue mui-btn-block" id="SBTianZheiJie">按钮</button>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = extra.id || plus.storage.getItem('BianJiID')

				document.getElementById('noteTitle').value = extra.noteTitle || ''
				document.getElementById('noteContent').value = extra.noteContent || ''

				console.log(id)

				document.getElementById('SBTianZheiJie').addEventListener('tap',function(){

					var noteTitle = document.getElementById('noteTitle').value;
					var noteContent = document.getElementById('noteContent').value;

					mui.confirm('确定保存修改吗？','提示',['取消','确认'],function (e) {

						if (e.index == 1) {

							mui.ajax(http +  '/api/history/note',{
								data: JSON.stringify({
								    noteId: id,
								    noteTitle: noteTitle,
								    noteContent: noteContent
								}),
								headers:{
									'Content-Type':'application/json',
									'Authorization':localStorage.getItem('token')
								},

								dataType:'json',
								type:'PUT',
								timeout:10000,
								success:function(data){

									if (data.code == 200) {

										mui.toast('更新完成')
										mui.back()

									} else {
										mui.toast(data.msg || '更新失败')
									}

								},
								error:function(xhr,type,errorThrown){

								}
							});

						} else{

						}

					},'div')

				})

			})
		</script>
	</body>

</html>
