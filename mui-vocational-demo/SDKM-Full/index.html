<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	
	<header class="mui-bar mui-bar-nav">
		<h1 class="mui-title" style="color: red;">登录</h1>
	</header>
	
	<div class="mui-content">
		
		<form class="mui-input-group">
			<div class="mui-input-row">
				<label>账号</label>
				<input type="text" class="mui-input-clear" placeholder="请输入账号" id="username">
			</div>
		</form>
		
		<form class="mui-input-group">
			<div class="mui-input-row">
				<label>密码</label>
				<input type="password" class="mui-input-password" placeholder="请输入密码" id="password">
			</div>
		</form>
		
		
		<div class="mui-content" id="but">
			<button type="button" id="butt" class="mui-btn mui-btn-red mui-btn-block">登录</button>
		</div>
		
	</div>
	<script src="js/http.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			mui('#but').on('tap','#butt',function(){

				var username = document.getElementById('username').value;
				var password = document.getElementById('password').value;

				if (username == '' || password == '') {
					mui.toast('账号密码不能为空')
				} else{

					mui.ajax(http + '/api/login',{
						data:{
							username:username,
							password:password
						},
						headers:{
							'Content-Type':'application/json'
						},

						dataType:'json',
						type:'POST',
						timeout:10000,
						success:function(data){

							if(data.code == 200){

								mui.toast('欢迎')
								localStorage.setItem('token',data.token)
								mui.openWindow({
									url:'./exe/page.html'
								})

							}else{
								mui.toast('不欢迎')
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}

			})
		})
    </script>
</body>
</html>
