<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">公益活动</h1>
		</header>
		<div class="mui-content">
			
			<div id="GengNeng2List" style="padding: 5px;">
				
				</div>
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function YeiMian(){

				mui.ajax(API_BASE + '/api/activity/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'get',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {
							var GongYoHUoDongHTML = '';
							for (var  i = 0 ; i < data.rows.length ; i++) {
								GongYoHUoDongHTML += `<div style="background-color: #f7f7f7;">

				<img src="${API_BASE + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">

				<div id="NeiRong">
					<h4>${data.rows[i].activityName}</h4>
					<h5>${data.rows[i].startEndTime}</h5>
					<p class="mui-ellipsis">${data.rows[i].briefIntroduction}</p>
				</div>
			<hr >
			<p>
				人类：${data.rows[i].applyNum}
				<button type="button" BaoMingID="${data.rows[i].id}" class="mui-btn mui-btn-blue" style="position: absolute;right: 0;border-radius: 50px; background-color: red;">按钮</button>
			</p>
			</div>`
							}
							document.getElementById('GengNeng2List').innerHTML = GongYoHUoDongHTML
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});
				}
				YeiMian()
			})

		</script>
	</body>

</html>
