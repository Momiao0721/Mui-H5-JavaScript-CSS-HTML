<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="./css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<div id="">
			<h3 style="color: red; position: relative;left: 35%;">时代楷模</h3>
		</div>
		<div class="mui-content">
			<div id="but" style="padding: 18px;">
				
			<br>
			<br>
				账号
					<input type="text" class="mui-input-clear" placeholder="请输入账号" style="border-radius: 30px;" id="username">
					
				密码
					<input type="text" class="mui-input-clear" placeholder="请输入密码" style="border-radius: 30px;" id="password">
				
				<button id="butt" style="border-radius: 30px;" type="button" class="mui-btn mui-btn-red mui-btn-block">登录</button>
				
			</div>
		</div>
		<script src="./js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="./js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function Denglu(){

					mui('#but').on('tap','#butt',function(){

						var username = document.getElementById('username').value;
						var password = document.getElementById('password').value;

						if(username == '' || password == ''){
							mui.toast('账号/密码不能为空')
						}else{
							mui.ajax(http + '/api/login',{
								data:{
									username:username,
									password:password
								},
								headers:{
									'Content-Type':'application/json'
								},

								dataType:'json',
								type:'post',
								timeout:10000,
								success:function(data){
									if (data.code == 200) {
										mui.toast('欢迎' + username + '登陆成功')
										localStorage.setItem('token',data.token)
										mui.openWindow({
											url:'./exe/page.html',
										})
									}else{
										mui.toast('账号/密码错误')
									}
								},
								error:function(xhr,type,errorThrown){

								}
							});
						}

					})

				}
				Denglu()
			})
		</script>
	</body>

</html>
