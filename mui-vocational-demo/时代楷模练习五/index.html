<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
	<script src="js/http.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/mui.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
	<div style="position: absolute;right: 6%;" id="TiaoGuo">
		<button type="button" class="mui-btn mui-btn-red">跳过
		<span id="time">5</span>
		</button>
	</div>
	<br>
	<br>
	<div id="slider" class="mui-slider" >
	  <div class="mui-slider-group mui-slider-loop" id="lbt1"></div>
		
		
		
		
		
		
		
		

	  <div class="mui-slider-indicator" id="lbt2"></div>
		
		
	</div>
	
	
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			function TiaoGuo(){

				mui.ajax(http + '/api/guide/list?type=1',{
					headers:{
						'Content-Type':'application/json'
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {
							var YingDaoYei = '';
							var YingDaoYeiXia = ''

							YingDaoYei += `<div class="mui-slider-item mui-slider-item-duplicate">
		  <a href="#">
			<img src="${httpimg + data.rows[data.rows.length-1].imgUrl}">
		  </a>
		</div>`
							for (var i = 0 ; i < data.rows.length ; i++) {
								YingDaoYei += `<div class="mui-slider-item">
		  <a href="#">
			<img src="${httpimg + data.rows[i].imgUrl}">
		  </a>
		</div>`
								YingDaoYeiXia += `<div class="mui-indicator"></div>`
							}

							YingDaoYei += `<div class="mui-slider-item mui-slider-item-duplicate">
		  <a href="#">
			<img src="${httpimg + data.rows[0].imgUrl}">
		  </a>
		</div>`
							document.getElementById('lbt1').innerHTML = YingDaoYei
							document.getElementById('lbt2').innerHTML = YingDaoYeiXia
						}
						mui('.mui-slider').slider({interval:3000})
					},
					error:function(xhr,type,errorThrown){

					}
				});

			}
			TiaoGuo()

			document.getElementById('TiaoGuo').addEventListener('tap',function(){
				mui.openWindow({
					url:'DengLu.html',
					id:'DengLu'
				})
			})

			var c = 5;
			function WuMiao(){

				document.getElementById('time').innerHTML = c
				c = c-1

				if (c < 0) {
					mui.openWindow({
						url:'DengLu.html',
						id:'DengLu'
					})
					return;
				}

				setTimeout(WuMiao,1000)

			}
			WuMiao()
		})
    </script>
</body>
</html>
