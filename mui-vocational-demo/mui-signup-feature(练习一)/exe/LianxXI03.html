<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">功能3</h1>
		</header>
		<div class="mui-content">
			
			 <ul class="mui-table-view" id="List">
				 
			 	
			 	
			 </ul>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function BiaoMIng(){

					mui.ajax(http + '/api/activity/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if(data.code == 200){

								var ListHTML = '';
								for (var i = 0 ; i < data.rows.length ; i++) {
									ListHTML += `<li BaoMIngID="${data.rows[i].id}" class="mui-table-view-cell mui-media">
			 		<a href="javascript:;">
			 			<img src="${httpimg + data.rows[i].imgUrl}" style="width: 100%; height: 200px;">
			 			<div class="mui-media-body">
			 				<h4>${data.rows[i].activityName}</h4>
							<h5>${data.rows[i].startEndTime}</h5>
			 				<p class="mui-ellipsis">${data.rows[i].briefIntroduction}</p>
			 			</div>
			 		</a>
					<hr >
					<p style="position: relative;left: 40%;">点击报名</p>
			 	</li>
				<br>
				`
								}
								document.getElementById('List').innerHTML = ListHTML
								var XiangQingYei = document.querySelectorAll('#List .mui-media')

								for (var j = 0 ; j < XiangQingYei.length; j++) {
								(function(TiaoZuan){
									TiaoZuan.addEventListener('tap',function(){

									var id = this.getAttribute('BaoMIngID')
									console.log(id)
									plus.storage.setItem('BaoMIngID',id);

									mui.openWindow('GongNEngSanLianXi.html',{
										extras:{
											id:id
										}
									})

								})
							})(XiangQingYei[j])
								}

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				BiaoMIng()
			})
		</script>
	</body>

</html>
