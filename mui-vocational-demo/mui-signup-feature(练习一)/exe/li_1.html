<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">报名练习</h1>
		</header>
		<div class="mui-content">
			
			<div id="baoMingLIstlianXiLIONe" style="position: 15px;">
				
				<div style="padding: 5px; background-color: #cccccc; border-radius: 30px;">
					<img src="../IMG/de9509b7ce004.jpg" style="width: 200px; width: 100%; border-radius: 51px; padding: 2px;">
					<div id="" style="padding: 5px;">
						<h4>123</h4>
						<h5>123</h5>
						<p class="mui-ellipsis">123</p>
					</div>
					<hr >
						<button type="button" class="mui-btn mui-btn-red mui-media" style="position: absolute; right: 3%; border-radius: 30px;" BaoMIngID="">报名</button>
					<p>
						<p>人类:</p>
					</p>
				</div>
				
				
				
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function lIstBiao(){
				mui.ajax(http + '/api/activity/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'get',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {
							var BaoMIngList = '';
							for (var i = 0 ; i < data.rows.length ; i++) {

							BaoMIngList += `<div style="padding: 5px; background-color: #cccccc; border-radius: 30px;">
					<img src="${httpimg + data.rows[i].imgUrl}" style="width: 200px; width: 100%; border-radius: 51px; padding: 2px;">
					<div id="" style="padding: 5px;">
						<h4>${data.rows[i].activityName}</h4>
						<h5>${data.rows[i].overTime}</h5>
						<p class="mui-ellipsis">${data.rows[i].briefIntroduction}</p>
					</div>
					<hr >
						<button type="button" class="mui-btn mui-btn-red mui-media" style="position: absolute; right: 3%; border-radius: 30px;" BaoMIngID="${data.rows[i].id}">报名</button>
					<p>
						<p>人类:${data.rows[i].applyNum}</p>
					</p>
				</div>
				<br>`

							}
							document.getElementById('baoMingLIstlianXiLIONe').innerHTML = BaoMIngList;

							var BAoMingLianXiList = document.querySelectorAll('#baoMingLIstlianXiLIONe .mui-media')

							for (var j = 0 ; j < BAoMingLianXiList.length ; j++) {

								(function(YeiMian){
									YeiMian.addEventListener('tap',function(){

										var id = this.getAttribute('BaoMIngID');

										console.log(id)

										plus.storage.setItem('BaoMIngID',id)

										mui.openWindow('BaoMingXiangQingLianXi.html',{
											extras:{
												id:id
											}
										})
									})
								})(BAoMingLianXiList[j])

							}

						}
					},
					error:function(xhr,type,errorThrown){

					}
				});
				}
				lIstBiao()

			})
		</script>
	</body>

</html>
