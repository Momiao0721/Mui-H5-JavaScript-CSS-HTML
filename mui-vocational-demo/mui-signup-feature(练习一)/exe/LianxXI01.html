<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">功能1</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view" style="border-radius: 40px; padding: 7px;" id="GongNiengOne">
				
				
				
				
				
			</ul>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function GongNeng(){

					mui.ajax(http + '/api/activity/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var GongNengOneList = ''

								for (var i = 0 ; i < data.rows.length ; i++) {
									GongNengOneList += `<div id="" style="border-radius: 40px; padding: 7px;">
					<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
					<div id="">
						<h4>${data.rows[i].activityName}</h4>
						<h5>${data.rows[i].startEndTime}</h5>
						<p class="mui-ellipsis">${data.rows[i].briefIntroduction}</p>
					</div>
						<hr >
					<p>人数：${data.rows[i].applyNum}
					<button type="button" bAOmiNGID="${data.rows[i].id}" class="mui-btn mui-btn-red mui-media" style="position: absolute;right: 5%; border-radius: 30px;">报名</button>
					</p>
				</div>
				<br>
				`
								}
								document.getElementById('GongNiengOne').innerHTML = GongNengOneList;

								var XiangQingList = document.querySelectorAll('#GongNiengOne .mui-media')

								for (var j = 0 ; j < XiangQingList.length ; j++) {
									(function(XiangQing){
										XiangQing.addEventListener('tap',function(){

											var id = this.getAttribute('bAOmiNGID')
											console.log(id)
											if (!id) return;
											plus.storage.setItem('bAOmiNGID',id);
											mui.openWindow('GongNEngONeXiangQIng.html',{
												extras:{
													id:id
												}
											})

										})
									})(XiangQingList[j])
								}

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				GongNeng()

				window.addEventListener('refresh', function () {
					GongNeng();
				})

			})
		</script>
	</body>

</html>
