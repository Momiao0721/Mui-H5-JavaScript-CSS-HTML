<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">功能3详情</h1>
		</header>
		<div class="mui-content">
			<div id="dad">
				
			
			</div>
			
		</div>
		<nav class="mui-bar mui-bar-tab" id="Xia">
			
		</nav>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			    var extra = plus.webview.currentWebview().extra || {}
			    var id = plus.storage.getItem('BaoMIngID') || extra.id
			    console.log(id)

			    function XiangQing() {
			        mui.ajax(http + '/api/activity/' + id, {
			            data: {},
			            headers: { 'Authorization': localStorage.getItem('token') },
			            dataType: 'json',
			            type: 'get',
			            timeout: 10000,
			            success: function (data) {
			                if (data.code == 200) {
			                    var XiangQingHTML = '';
			                    var XiangQIngXia = '';

			                    XiangQingHTML += `<div id="To" style="background-color: #C8C7CC; padding: 5px;">
			                        <img src="${httpimg + data.data.imgUrl}" style="height: 200px; width: 100%;">
			                        <div>
			                            <h4>${data.data.activityName}</h4>
			                            <h5>${data.data.initiator}</h5>
			                            <h5>${data.data.startEndTime}</h5>
			                        </div>
			                        <br>
			                        简介：${data.data.activityDetail}
			                    </div>`

			                    XiangQIngXia += `<button type="button" class="mui-btn mui-btn-red" style="position: absolute;right: 0; width: 50%;" id="BaoMINg">报名</button>
			                        <p style="color:#000000;" id="Su">报名人数：${data.data.applyNum}</p>`

			                    document.getElementById('Xia').innerHTML = XiangQIngXia;
			                    document.getElementById('dad').innerHTML = XiangQingHTML;

			                    if (localStorage.getItem('JiYi_' + id)) {
			                        var btn = document.getElementById('BaoMINg');
			                        btn.setAttribute('disabled', 'disabled');
			                        btn.classList.add('mui-disabled');
			                    }
			                }
			            },
			            error: function (xhr, type, errorThrown) {}
			        });
			    }
			    XiangQing()

			    function GenXing() {
			        mui.ajax(http + '/api/activity/' + id, {
			            data: {},
			            headers: { 'Authorization': localStorage.getItem('token') },
			            dataType: 'json',
			            type: 'get',
			            timeout: 10000,
			            success: function (data) {
			                if (data.code == 200) {
			                    document.getElementById('Su').innerHTML = '报名人数：' + data.data.applyNum;
			                }
			            },
			            error: function (xhr, type, errorThrown) {}
			        });
			    }

			    mui('#Xia').on('tap', '#BaoMINg', function () {

			        if (localStorage.getItem('JiYi_' + id)) return;

			        mui.confirm('你确定报名喵？', '报名', ['是', '否'], function (e) {
			            if (e.index == 0) {
			                mui.ajax(http + '/api/activity/apply/', {
			                    data: { activityId: id },
			                    headers: {
			                        'Content-Type': 'application/json',
			                        'Authorization': localStorage.getItem('token')
			                    },
			                    dataType: 'json',
			                    type: 'post',
			                    timeout: 10000,
			                    success: function (data) {
			                        console.log(data.code)
			                        if (data.code == 200) {
			                            mui.alert('报名成功');

			                            localStorage.setItem('JiYi_' + id, '1');

			                            var btn = document.getElementById('BaoMINg');
			                            btn.setAttribute('disabled', 'disabled');
			                            btn.classList.add('mui-disabled');

			                            GenXing();

			                            var dadGEnXing = plus.webview.currentWebview().opener();
			                            if (dadGEnXing) {
			                                mui.fire(dadGEnXing, 'refresh')
			                            }
			                        }
			                    },
			                    error: function (xhr, type, errorThrown) {}
			                });
			            }
			        })
			    })
			})
		</script>
	</body>

</html>
