	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">报名功能</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view" id="baoMingList">

						<img style="height: 200px; width: 100%;" src="">
						<div class="mui-media-body">
							幸福
							<p class="mui-ellipsis">能和心爱的人一起睡觉，是件幸福的事情；可是，打呼噜怎么办？</p>
						</div>
						<hr >
						<div>
							<p>人类:
							<button type="button" class="mui-btn mui-btn-red mui-media" style="border-radius: 50px; position: absolute;right: 3%;" id="baoMingID=""">报名</button>

			</ul>
			
			
		</div>
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {
			   
			   function BaoMing(){
				   
				   mui.ajax(http + '/api/activity/list',{
				   	data:{
				   		
				   	},
					'Content-Type':'application/json',
					
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					
				   	dataType:'json',//服务器返回json格式数据
				   	type:'get',//HTTP请求类型
				   	timeout:10000,//超时时间设置为10秒；
				   	success:function(data){
				   		if (data.code == 200) {
				   			
							var bMingHTML = '';
							
							for (var i = 0 ; i < data.rows.length ; i++) {
								
								bMingHTML += `<li style="padding: 10px;">
						<img style="height: 200px; width: 100%;" src="${httpimg + data.rows[i].imgUrl}">
						<div class="mui-media-body">
							${data.rows[i].activityName}
							<p class="mui-ellipsis">${data.rows[i].activityDetail}</p>
						</div>
						<hr >
						<div>
							<p>人类:${data.rows[i].applyNum}
							<button type="button" class="mui-btn mui-btn-red mui-media" style="border-radius: 50px; position: absolute;right: 3%;" id="baoMingID="${data.rows[i].id}"">报名</button>
							</p>
						</div>
				</li>`
								
							}
							
							document.getElementById('baoMingList').innerHTML = bMingHTML;
							
							var XiangQingList = document.querySelectorAll('#baoMingList .mui-media')
							for (var j = 0 ; j < XiangQingList.length ; j++) {
								
								(function(XiangQing){
									
									XiangQing.addEventListener('tap',function(){
										
										
										var id = this.getAttribute('baoMingID');
										
										console.log(id)
										
										if(!id)return
										
										plus.storage.setItem('baoMingID',id)
										mui.openWindow('GengNeng3HTML.html',{
											extras:{
												id:id	
											}
										})
										
									})
									
								})(XiangQingList[j])
								
								
							}
				   		}
				   	},
				   	error:function(xhr,type,errorThrown){
				   		
				   	}
				   });
				   
			   }
			   BaoMing()
			})
		</script>
	</body>

</html>
