<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">详情页</h1>
		</header>
		<div class="mui-content">
			<div id="BaoMing">
				
		
			
			</div>
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('BaoMIngID') || extra.id
				console.log(id)

				function BaoMingXingQing(){
					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var XiangQingHTML = '';
								var JiYii = localStorage.getItem('JiYi' + id)
								XiangQingHTML += `	人数:${data.data.applyNum}
			<button type="button" class="mui-btn mui-btn-red mui-btn-block ${JiYii?'mui-disabled':''}" id="BaoMIng">按钮</button>`
								document.getElementById('BaoMing').innerHTML = XiangQingHTML
								document.getElementById('BaoMIng').addEventListener('tap',function(){

									mui.confirm('message','title',['取消','确认'],function (e) {
										if (e.index == 1) {
											mui.ajax(http + '/api/activity/apply',{
												data:{
													activityId:id
												},
												headers:{
													'Content-Type':'application/json',
													'Authorization':localStorage.getItem('token')
												},

												dataType:'json',
												type:'post',
												timeout:10000,
												success:function(data){
													console.log(data.code)
													if (data.code == 200) {

														mui.toast('报名成功')
														localStorage.setItem('JiYi' + id , 1)
														BaoMingXingQing()

													}
												},
												error:function(xhr,type,errorThrown){

												}
											});
										}
									},'div')

								})
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});
				}
				BaoMingXingQing()
			})
		</script>
	</body>

</html>
