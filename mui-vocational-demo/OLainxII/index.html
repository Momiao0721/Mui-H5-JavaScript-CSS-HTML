<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	
	<div style="height: 50px; padding: 10px;">
		<button type="button" class="mui-btn mui-btn-red" id="DenglUyei">按钮<span id="Time">5</span></button>
	</div>
	
	<div>
		
		<div id="slider" class="mui-slider" >
		  <div class="mui-slider-group mui-slider-loop" id="lbt1"></div>
			
			
			
			
			
			
			
			

		  <div class="mui-slider-indicator" id="lbt2"></div>
			
		</div>
		
	</div>
	
	<script src="./js/http.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			mui.ajax(http + '/api/guide/list?type=1',{
				headers:{
					'Content-Type':'application/json'
				},
				dataType:'json',
				type:'GET',
				timeout:10000,
				success:function(data){
					console.log(data.code)
					if (data.code == 200) {
						var YingDaoYeiHTML = '';
						var YingDaoYeiXia = '';
						var YeiMian = data.rows
						 for (var i = 0 ; i < data.rows.length ; i++) {
						 	YingDaoYeiHTML += `<div class="mui-slider-item mui-slider-item-duplicate">
			  <a href="#">
				<img src="${httpimg + YeiMian[YeiMian.length-1].imgUrl}">
			  </a>
			</div> `
			for (var i = 0 ; i < YeiMian.length ; i++) {

				YingDaoYeiHTML += `<div class="mui-slider-item">
			  <a href="#">
				<img src="${httpimg + YeiMian[i].imgUrl}">
			  </a>
			</div>`

				YingDaoYeiXia += `<div class="mui-indicator"></div>`
			}

						YingDaoYeiHTML += `<div class="mui-slider-item mui-slider-item-duplicate">
			  <a href="#">
				<img src="${httpimg + YeiMian[0].imgUrl}">
			  </a>
			</div>`
						 }
						 document.getElementById('lbt1').innerHTML = YingDaoYeiHTML
						 document.getElementById('lbt2').innerHTML = YingDaoYeiXia
					}
					mui('.mui-slider').slider({interval:3000})
				},
				error:function(xhr,type,errorThrown){

				}
			});

			document.getElementById('DenglUyei').addEventListener('tap',function(){

				mui.openWindow({
					url:'DengLu.html',
					id:'DengLu'
				})

			})

				c = 5;
			function Time(){
				document.getElementById('Time').innerHTML = c
				c = c-1

				if (c < 1) {
					mui.openWindow({
						url:'DengLu.html',
						id:'DengLu'
					})
					return
				}
				setTimeout(Time,1000)
			}
			Time()
		})
    </script>
</body>
</html>
