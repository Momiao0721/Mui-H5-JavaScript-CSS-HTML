<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
	<script src="./js/http.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<h1 class="mui-title">登录</h1>
	</header>
	<div class="mui-content">
		
		
			<input type="text" class="mui-input-clear" placeholder="请输入" id="username">
			
			<input type="password" class="mui-input-password" placeholder="请输入" id="password">
			
			<div id="but">
				<button type="button" class="mui-btn mui-btn-red mui-btn-block" id="butt">按钮</button>
			</div>
		
	</div>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui('#but').on('tap','#butt',function(){

			var username = document.getElementById('username').value;
			var password = document.getElementById('password').value;

			if (username == '' || password == '') {
				mui.toast('账号/密码不能为空')
			} else{

				mui.ajax(http + '/api/login',{
					data:{
						username:username,
						password:password
					},
					headers:{
						'Content-Type':'application/json'
					},

					dataType:'json',
					type:'post',
					timeout:10000,
					success:function(data){

						if (data.code == 200) {

							mui.toast('欢迎' + username + '登陆成功')
							localStorage.setItem('token',data.token);
							mui.openWindow({
								url:'./exe/page.html'
							})

						} else{
							mui.toast('密码错误')
						}

					},
					error:function(xhr,type,errorThrown){

					}
				});

			}

		})
    </script>
</body>
</html>
