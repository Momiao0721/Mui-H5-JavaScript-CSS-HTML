<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">公益详情</h1>
		</header>
		<div class="mui-content">
			
			<div>
				<div id="GongYixiangQ" style="padding: 10px;">
					
				</div>
			</div>
			
		</div>
		
		<nav class="mui-bar mui-bar-tab" id="GongYiXia">
			
		</nav>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('BaoMingID') || extra.id

				console.log(id)

				function GongYiHTML(){

					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								var GongYi = '';
								GongYi += `<div style="padding: 5px; background-color: #ACACB4; border-radius: 10px;">
						<img src="${httpimg + data.data.imgUrl}" style="height: 180px; width: 100%; border-radius: 10px;">
						<div style="padding: 10px;">
							<h4>${data.data.activityName}</h4>
							<h5 style="color: #000000;">开始与结束时间:${data.data.startEndTime}</h5>
							<h5 style="color: #000000;">发起方:${data.data.initiator}</h5>
						</div>
					</div>
					<br>
					<div style="padding: 10px; background-color: #dcdcdc; border-radius: 10px;">
						<h5 style="color: #000000;">简介:${data.data.activityDetail}</h5>
					</div>`

								document.getElementById('GongYixiangQ').innerHTML = GongYi
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				GongYiHTML()

				function Xia(){

					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var BaoMingJiYi = localStorage.getItem('BaoMing-JiYi' + id)

								var BaoMingHTML = ''
								BaoMingHTML += `<div style="padding: 10px;">
													<h4>报名人数:${data.data.applyNum}</h4>
													<button id="BaoMing" type="button" class="mui-btn mui-btn-red ${BaoMingJiYi?'mui-disabled':''}" style="position: absolute; right: 0; width: 50%;">报名</button>
												</div>`

								document.getElementById('GongYiXia').innerHTML = BaoMingHTML

								document.getElementById('BaoMing').addEventListener('tap',function(){
									mui.confirm('message','title',['取消','确认'],function (e) {
										if (e.index == 1) {
											mui.ajax(http + '/api/activity/apply',{
												data:{
													activityId:id
												},
												headers:{
													'Content-Type':'application/json',
													'Authorization':localStorage.getItem('token')
												},
												dataType:'json',
												type:'POST',
												timeout:10000,
												success:function(data){
													console.log(data.code)
													if (data.code == 200) {
														mui.toast('报名成功')
														localStorage.setItem('BaoMing-JiYi' + id , 1)
														Xia()
													} else{
														mui.toast('报名失败')
													}
												},
												error:function(xhr,type,errorThrown){

												}
											});
										} else{

										}
									},'div')
								})

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				Xia()
			})
		</script>
	</body>

</html>
