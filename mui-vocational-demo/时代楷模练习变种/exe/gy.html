<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">公益</h1>
		</header>
		<div class="mui-content">
			<button type="button" class="mui-btn mui-btn-red" style="height: 20px;" id="DianJiGengXing">点击更新</button>
			<div style="padding: 8px;" id="GongYi">

				

			</div>

		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function() {

				function GongYiHTML() {
					mui.ajax(http + '/api/activity/list', {
						data: {

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType: 'json',
						type: 'GET',
						timeout: 10000,
						success: function(data) {
							if (data.code == 200) {
								var GongYi = '';
								for (var i = 0 ; i < data.rows.length ; i++) {
									GongYi += `<div id="" style="padding: 10px; background-color: #CCCCCC; border-radius: 10px;">
					<img src="${httpimg + data.rows[i].imgUrl}"
						style="height: 200px; width: 100%; border-radius: 10px;">
					<div style="padding: 10px;">
						<h4>${data.rows[i].activityName}</h4>
						<h5 style="color: #000000;">开始与结束时间:${data.rows[i].startEndTime}</h5>
						<h5 style="color: #000000;" class="mui-ellipsis">${data.rows[i].briefIntroduction}</h5>
						<hr>
						<div>
							<button type="button" class="mui-btn mui-btn-red mui-media"
								style="position: absolute;right: 7%; border-radius: 10px;" BaoMingID="${data.rows[i].id}">报名</button>
							<h5 style="color: #000000;">
								报名人数:${data.rows[i].applyNum}
							</h5>
						</div>
					</div>
				</div>
				<br>`
								}
								document.getElementById('GongYi').innerHTML = GongYi
								var BaoMingYeiMian = document.querySelectorAll('#GongYi .mui-media')

								for (var i = 0 ; i < BaoMingYeiMian.length ;i++) {
									(function(YeiMian){
										YeiMian.addEventListener('tap',function(){

											var id = this.getAttribute('BaoMingID')

											console.log(id)

											plus.storage.setItem('BaoMingID',id)

											mui.openWindow({
												url:'BaoMingYei.html',
												id:'BaoMingYei',
												extras:{
													id:id
												}
											})

										})
									})(BaoMingYeiMian[i])
								}
							}
						},
						error: function(xhr, type, errorThrown) {

						}
					});
				}
				GongYiHTML()

				document.getElementById('DianJiGengXing').addEventListener('tap',function(){
					GongYiHTML()
				})

			})
		</script>
	</body>

</html>
