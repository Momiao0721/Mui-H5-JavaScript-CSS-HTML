<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">轮播图方法2</h1>
		</header>
		<div class="mui-content">
			
			<div class="mui-slider">
				<div id="slider" class="mui-slider-group mui-slider-loop">
					
			
				</div>
				<div class="mui-slider-indicator">
					<div class="mui-indicator mui-active"></div>
					<div class="mui-indicator"></div>
					<div class="mui-indicator"></div>
					<div class="mui-indicator"></div>
				</div>
			</div>
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function lunbotu() {

					mui.ajax(API_BASE + '/api/building/banner/list', {
						data: {},
						headers: {
							'Authorization': localStorage.getItem('token')
						},
						dataType: 'json',
						type: 'get',
						timeout: 10000,
						success: function(data) {

							if (data.code == 200) {
								var lbt = document.getElementById('slider');
								var lbtHTML = '';
								var lbtTou = `<div class="mui-slider-item mui-slider-item-duplicate">
				  <a href="#">
					<img src="${API_BASE + data.rows[data.rows.length-1].imgUrl}">
				  </a>
				</div>`;
								var lbtWei = `<div class="mui-slider-item mui-slider-item-duplicate">
				  <a href="#">
					<img src="${API_BASE+data.rows[0].imgUrl}">
				  </a>
				</div>`;
								for (var i = 0; i < data.rows.length; i++) {
									lbtHTML += `<div class="mui-slider-item">
				  <a href="#">
					<img src="${API_BASE + data.rows[i].imgUrl}">
				  </a>
				</div>`;
								}

								lbtHTML = lbtTou + lbtHTML + lbtWei;
								lbt.innerHTML = lbtHTML;
								var gallery = mui('.mui-slider');
								gallery.slider({
									interval: 3000
								});
							}
						},
						error: function(xhr, type, errorThrown) {

						}
					});
				}
				lunbotu()

			})
		</script>
	</body>

</html>
