<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		
		
		<div class="mui-off-canvas-wrap mui-draggable">
		  
		  <aside class="mui-off-canvas-left" id="offCanvasSide">
			<div class="mui-scroll-wrapper">
			  <div class="mui-scroll">
				
					
			  </div>
			</div>
		  </aside>
		  
		  <div class="mui-inner-wrap">
			
			<header class="mui-bar mui-bar-nav">
			  <a class="mui-icon mui-action-menu mui-icon-bars mui-pull-left"  href="#offCanvasSide" ></a>
			  <h1 class="mui-title">标题</h1>
			</header>
			
			<div class="mui-content mui-scroll-wrapper">
			  <div class="mui-scroll">
				
				 	
				
				<div class="mui-content">
					
					<div id="" style="padding: 10px;">
						
						<div id="slider" class="mui-slider" >
						  <div class="mui-slider-group mui-slider-loop" id="lbt1"></div>
							
							
							
							
							
							
							
							
							
						  <div class="mui-slider-indicator" id="lbt2"></div>
							
						</div>
						
					</div>
					
					<div style="padding: 10px;">
						
					<div id="" style="background-color: #929292; color: cornsilk; ">
						<marquee>文字轮播</marquee>
					</div>
					
					</div>
					<div style="padding: 10px;">
						
						<ul class="mui-table-view mui-grid-view mui-grid-9" id="jGG">
							
								
						
						</ul>
						
					</div>
					
					
						<div id="HuaiDongList" style="padding: 10px; overflow-x: auto; font-weight: normal; display: flex;">
							
						</div>
						
						
						<div id="" style="padding: 10px;">
							
							<ul class="mui-table-view" id="kmlb">
								
								
								
								
							</ul>
							
							<button type="button" class="mui-btn mui-btn-red mui-btn-block" id="GengXing">更新</button>
						</div>
						
					
					
				</div>	
					
					
					
					
			  </div>
			</div> 
			<div class="mui-off-canvas-backdrop"></div>
		  </div> 
		</div>
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui('.mui-scroll-wrapper').scroll({})
			mui.plusReady(function () {

				function lbt(){

					mui.ajax(http + '/api/building/banner/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								var lbtHTMl = '';
								var lbtXia = '';
								var lbt = data.rows;

								lbtHTMl += `<div class="mui-slider-item mui-slider-item-duplicate">
					  <a href="#">
						<img src="${httpimg + lbt[lbt.length-1].imgUrl}">
					  </a>
					</div>`

								for (var i = 0 ; i < lbt.length ; i++) {
									lbtHTMl += `<div class="mui-slider-item">
					  <a href="#">
						<img src="${httpimg + lbt[i].imgUrl}">
					  </a>
					</div>`
									lbtXia += `<div class="mui-indicator"></div>`
								}

								lbtHTMl += `<div class="mui-slider-item mui-slider-item-duplicate">
					  <a href="#">
						<img src="${httpimg + lbt[0].imgUrl}">
					  </a>
					</div>`
								document.getElementById('lbt1').innerHTML = lbtHTMl
								document.getElementById('lbt2').innerHTML = lbtXia
							}
							mui('.mui-slider').slider({interval:3000})
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				lbt()

				function jgg(){
					var JggYeiMian = [{
						name:'li_1',
						id:'li_1'
					},
					{
						name:'li_2',
						id:'li_2'
					},
					{
						name:'li_3',
						id:'li_3'
					},
					]
					var jggHTML = '';
					for (var i = 0 ; i < JggYeiMian.length ; i++) {
						jggHTML += `<li class="mui-table-view-cell mui-media mui-col-xs-4 mui-col-sm-3">
							<a href="#" id="${JggYeiMian[i].id}">
								<img src="" style="height: 50px; width: 50px; border-radius: 40px;">
								<div class="mui-media-body">${JggYeiMian[i].name}</div>
							</a>
						</li>`
					}
					document.getElementById('jGG').innerHTML = jggHTML
					document.getElementById('li_1').addEventListener('tap',function(){
						mui.openWindow('li_1.html')
					});
					document.getElementById('li_2').addEventListener('tap',function(){
						mui.openWindow('li_2.html')
					});
					document.getElementById('li_3').addEventListener('tap',function(){
						mui.openWindow('li_3.html')
					});
				}
				jgg()

				function HengPai(){

					mui.ajax(http + '/api/model/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var HuaiDongList = '';
								for (var i = 0 ; i < data.rows.length ;i++) {
									HuaiDongList += `<div id="">
							<img src="${httpimg + data.rows[i].imgUrl}" style="height: 100px; width: 150px;">
							<div id="" style="width: 100px; height: 100px;">
							<p class='mui-ellipsis'>
							内容:${data.rows[i].title}
							</p>
							<p class='mui-ellipsis-2'>
							详情:${data.rows[i].content}
							</p>
							<br>
							</div>
					</div>`
								}
								document.getElementById('HuaiDongList').innerHTML = HuaiDongList

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				HengPai()

				function kmlb(){

					mui.ajax(http + '/api/model/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},
						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								kmlbQuan = data.rows;
								kmlbWuTiao = 5;
								GenXingKmlb()
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

					function GenXingKmlb(){

						if(kmlbWuTiao >= kmlbQuan.length){
							kmlbWuTiao = kmlbQuan.length
						}

						var kmlbHTMl = '';
						for (var i = 0 ; i < kmlbWuTiao ; i++) {
							if (i % 2 == 1) {
								kmlbHTMl += `<li class="mui-table-view-cell mui-media">
							<a href="javascript:;">
								<img class="mui-media-object mui-pull-left" src="${httpimg + kmlbQuan[i].imgUrl}">
								<div class="mui-media-body">
									${kmlbQuan[i].title}
									<h4>${kmlbQuan[i].name}</h4>
									<p class="mui-ellipsis">${kmlbQuan[i].content}</p>
								</div>
							</a>
						</li>`
							} else{
								kmlbHTMl += `<li class="mui-table-view-cell mui-media">
									<a href="javascript:;">
										<img class="mui-media-object mui-pull-right" src="${httpimg  + kmlbQuan[i].imgUrl}">
										<div class="mui-media-body">
											${kmlbQuan[i].title}
											<h4>${kmlbQuan[i].name}</h4>
											<p class="mui-ellipsis">${kmlbQuan[i].content}</p>
										</div>
									</a>
								</li>`
							}
						}
						document.getElementById('kmlb').innerHTML = kmlbHTMl;

					}

					document.getElementById('GengXing').addEventListener('tap',function(){

						kmlbWuTiao += 5;
						GenXingKmlb()

						if (kmlbWuTiao >= kmlbQuan.length) {
							this.innerHTML = '更新成功'
							this.getAttribute('disabled','disabled')
							this.classList.add('mui-disabled')
						}

					})

				}
				kmlb()

			})
		</script>
	</body>

</html>
