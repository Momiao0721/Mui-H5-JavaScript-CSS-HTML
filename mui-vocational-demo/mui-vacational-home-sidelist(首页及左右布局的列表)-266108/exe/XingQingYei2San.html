<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">List详情</h1>
		</header>
		<div class="mui-content">
			
			<div id="XingQing">
				
				
						
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('XingXi') || extra.id;

				console.log(id)

				function XingQing(){

					mui.ajax(API_BASE + '/api/model/list' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var XingQing = '';
								var Xing = data.rows;
								XingQing += `<div style="">
					<img src="${API_BASE + Xing.imgUrl}" style="height: 200px; width: 100%; padding: 5%;">
					<div id="" style="position: absolute;left: 5%;">

						<h4>${Xing.title}</h4>

						<h5>${Xing.name}</h5>

						<p>${Xing.content}</p>
					</div>

				</div>`
				document.getElementById('XingQing').innerHTML = XingQing

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				XingQing()
			})
		</script>
	</body>

</html>
