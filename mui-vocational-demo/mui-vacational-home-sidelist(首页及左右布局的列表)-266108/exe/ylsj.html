<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">左右</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view" style="overflow: hidden;" id="rlList">   
				
					
					
					
					
				 
				
			</ul>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function zt(){

				mui.ajax(API_BASE + '/api/model/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'get',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {
							var lrHTML = '';
							for (var i = 0 ; i < data.rows.length ; i++) {

							lrHTML += `<li TiaoZuanID = "${data.rows[i].id}" class="mui-table-view-cell mui-col-xs-6 mui-media" style="float: left;">
					<img src="${API_BASE + data.rows[i].imgUrl}" style="height: 100px; width: 100%;">
					<h4 class="mui-ellipsis">${data.rows[i].title}</h4>
					<h5>${data.rows[i].name}</h5>
					<p class="mui-ellipsis">${data.rows[i].content}</p>
				 </li>`
						}
							document.getElementById('rlList').innerHTML = lrHTML;
							var YeiMianlist = document.querySelectorAll('#rlList .mui-media')
							for (var j = 0 ; j < YeiMianlist.length ; j++) {
								(function(NeiRong){
									NeiRong.addEventListener('tap',function(){
										var id = this.getAttribute('TiaoZuanID')
										mui.openWindow('XiangQingYeiList.html',{
											extras:{id:id}
										})
									})
								})(YeiMianlist[j])
							}
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});
				}
				zt()
			})

		</script>
	</body>

</html>
