<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">感言详情</h1>
		</header>
		<div class="mui-content">
			
			<div id="" style="padding: 10px;">
				标题
			<textarea rows="" cols="" id="title"></textarea>
				内容
			<textarea style="height: 140px;" rows="" cols="" id="content"></textarea>
			<div id="but">
			<button type="button" class="mui-btn mui-btn-blue mui-btn-block" id="butt">添加</button>
			</div>
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				mui('#but').on('tap','#butt',function(){

					var title = document.getElementById('title').value;
					var content = document.getElementById('content').value

					if (title == '' || content == '') {
						mui.toast('标题/内容不能为空')
					} else{

						mui.ajax(http + '/api/testimonials',{
							data:{
								title:title,
								content:content
							},
							headers:{
								'Content-Type':'application/json',
								'Authorization':localStorage.getItem('token')
							},

							dataType:'json',
							type:'post',
							timeout:10000,
							success:function(data){
								console.log(data.code)
								if (data.code == 200) {
									mui.toast('添加成功')
									mui.alert('更新完成后重新登陆')
									mui.back()
								}else{
									mui.toast('添加失败')
								}
							},
							error:function(xhr,type,errorThrown){

							}
						});

					}

				})

			})
		</script>
	</body>

</html>
