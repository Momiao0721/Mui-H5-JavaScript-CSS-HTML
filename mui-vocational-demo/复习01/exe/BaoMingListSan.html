<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">报名List详情</h1>
		</header>
		<div class="mui-content">
			
			<div style="padding: 10px;" id="BaoMing">
				
				
			</div>
			
		</div>
		<nav class="mui-bar mui-bar-tab">
			<div id="BaoMingXia">
			
			</div>
		</nav>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('BaoMingID') || extra.id

				console.log(id)

				mui.ajax(http + '/api/activity/' + id,{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},
					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {
							var VaoMingListHTML = '';

							VaoMingListHTML += `<img src="${httpimg + data.data.imgUrl}" style="height: 200px; width: 100%;">

							<div id="" style="padding: 5px;">
								<h4>${data.data.activityName}</h4>
								<h5 style="color: #000000;">${data.data.startEndTime}</h5>
								<h5 style="color: #000000;">${data.data.initiator}</h5>
								<h5 style="color: #000000;">详情:${data.data.activityDetail}</h5>
							</div>`
							document.getElementById('BaoMing').innerHTML = VaoMingListHTML;
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});

				function XiaMian(){

					mui.ajax(http + '/api/activity/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {

								var BaoMingListXia = '';

								var BAoMingJiYi = localStorage.getItem('BAoMing_YeiMian' + id)

								BaoMingListXia += `<p style="color: #000000; font-size: 20px;">
			人类:${data.data.applyNum}
			<button id="BAoMing" type="button" class="mui-btn mui-btn-red ${BAoMingJiYi ? 'mui-disabled':''}" style="position: absolute;right: 0; width: 50%;">报名</button>
			</p>`
								document.getElementById('BaoMingXia').innerHTML = BaoMingListXia
								document.getElementById('BAoMing').addEventListener('tap',function(){
									mui.confirm('message','title',['取消','确认'],function (e) {
										if (e.index == 1) {
											mui.ajax(http + '/api/activity/apply',{
												data:{
													activityId:id
												},
												headers:{
													'Content-Type':'application/json',
													'Authorization':localStorage.getItem('token')
												},
												dataType:'json',
												type:'post',
												timeout:10000,
												success:function(data){

													if(data.code == 200){
														mui.toast('报名成功')
														XiaMian()
														localStorage.setItem('BAoMing_YeiMian' + id , 1)
													}

												},
												error:function(xhr,type,errorThrown){

												}
											});
										} else{
											mui.toast('报名失败')
										}
									},'div')
								})
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				XiaMian()

			})
		</script>
	</body>

</html>
