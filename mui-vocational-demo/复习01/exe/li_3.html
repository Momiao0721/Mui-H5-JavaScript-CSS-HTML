<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">报名List</h1>
		</header>
		<div class="mui-content">
			
			<div style="padding: 5px;">
				
				<div id="BaoMingList" style="padding: 5px;">
					
					
					
				</div>
				
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				mui.ajax(http + '/api/activity/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){

						if (data.code == 200) {
							var BaoMingHTML = '';
							for (var i = 0 ; i < data.rows.length ; i++) {
								BaoMingHTML += `<div id="" style="background-color: #AAAAAA; border-radius: 20px;">

						<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%; padding: 5px; border-radius: 20px;">

						<div style="padding: 5px;">
							<h4>${data.rows[i].activityName}</h4>
							<h5 style="color: #000000;">${data.rows[i].startEndTime}</h5>
							<h5 style="color: #000000;">${data.rows[i].initiator}</h5>
							<hr >
							<p style="color: #000000;">
								<button BaoMingID="${data.rows[i].id}" type="button" class="mui-media mui-btn mui-btn-red" style="position: absolute;right: 20px; border-radius: 10px;">报名</button>
							人数:${data.rows[i].applyNum}
							</p>
						</div>

					</div>
					<br>
					`
							}
							document.getElementById('BaoMingList').innerHTML = BaoMingHTML
							var BaoMingListYeiMian = document.querySelectorAll('#BaoMingList .mui-media')

							for (var j = 0 ; j < BaoMingListYeiMian.length ; j++) {
								(function(YeiMian){
									YeiMian.addEventListener('tap',function(){

										var id = this.getAttribute('BaoMingID')

										console.log(id)

										plus.storage.setItem('BaoMingID',id)

										mui.openWindow({
											url:'BaoMingListSan.html',
											id:'BaoMingListSan',
											extras:{
												id:id
											}
										})

									})
								})(BaoMingListYeiMian[j])
							}

						}

					},
					error:function(xhr,type,errorThrown){

					}
				});

			})
		</script>
	</body>

</html>
