<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">详情</h1>
		</header>
		<div class="mui-content">
			
			<div id="" style="padding: 10px;">
				<div id="" style="background-color: #8F8F94; border-radius: 30px;">
					
				<img src="" style="height: 200px; width: 100%; padding: 5px; border-radius: 30px;">
				
					<div style="padding: 3px;">
						<h4>123</h4>
						<h5 style="color: #000000;">132</h5>
						<h5 style="color: #000000;">132</h5>
						<h5 style="color: #000000;">132</h5>
					</div>
					
				</div>
				<br>
				<div id="" style="background-color: #797979; border-radius: 30px;">
					内容
				</div>
			</div>
			
		</div>
		<nav class="mui-bar mui-bar-tab">
			
			<div style="padding: 3px;" id="Xia">
				
				
			</div>
			
		</nav>
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('BaoMIingID') || extra.id

				console.log(id)

				function Xia(){
				mui.ajax(http + '/api/activity/' + id,{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						console.log(data.code)
						if (data.code == 200) {

							var XiaHTMl = '';

							var YIBaoMing = localStorage.getItem('BaoMing_XiangQing' +  id)

							XiaHTMl += `<p>报名人数:${data.data.applyNum}</p>
				<button type="button" class="mui-btn mui-btn-red ${YIBaoMing ? 'mui-disabled' : ''}"  style="width: 50%; position: absolute;right: 0;" id="BaoMing">报名</button>`

							document.getElementById('Xia').innerHTML = XiaHTMl

							document.getElementById('BaoMing').addEventListener('tap',function(){
								mui.confirm('你确定报名么','报名',['取消','确认'],function (e) {
									if (e.index == 1) {

										mui.ajax(http + '/api/activity/apply',{
											data:{
												activityId:id
											},
											headers:{
												'Content-Type':'application/json',
												'Authorization':localStorage.getItem('token')
											},

											dataType:'json',
											type:'post',
											timeout:10000,
											success:function(data){
												console.log(data.code)
												if (data.code == 200) {
													mui.toast('报名成功')

													localStorage.setItem('BaoMing_XiangQing' + id , '1')

													Xia()
												}

											},
											error:function(xhr,type,errorThrown){

											}
										});

									} else{

									}
								},'div')
							})

						}

					},
					error:function(xhr,type,errorThrown){

					}
				});
				}
				Xia()
			})
		</script>
	</body>

</html>
