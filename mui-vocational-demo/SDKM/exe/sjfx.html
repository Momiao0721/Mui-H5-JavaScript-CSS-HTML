<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">数据分析</h1>
		</header>
		<div class="mui-content">
			
			<div id="TiaoXingTu" style="height: 200px; width: 100%; color: #000000;"></div>
			<div id="ZeiXianTu" style="height: 200px; width: 100%; color: #000000;"></div>
			<div id="BingTu" style="height: 300px; width: 100%;"></div>
			
		</div>
		<script src="../js/echarts.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

			    var TiaoXiang = echarts.init(document.getElementById('TiaoXingTu'))
				var ZeiXian = echarts.init(document.getElementById('ZeiXianTu'))
				var Bing = echarts.init(document.getElementById('BingTu'))

				mui.ajax(http + '/api/data/comment/list_2',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {

							var d = data.data

							var lineOption = {
							    color:['#4e83ff','#94ffbf'],
							    legend: {
							        data: ['女性评论数统计', '男性评论数统计'],
							        left:"center",
							    },
							    grid:{
							        show:true
							    },
							    xAxis: {
							        type: 'category',
							        data: d.name,
							        splitLine:{ show: true },
							    },
							    yAxis: {
							        type: 'value',
							        min:0,
							    },

							    series: [{
							        name: '女性评论数统计',
							        data: d.woman,
							        type: 'bar'
							    },
							    {
							        name: '男性评论数统计',
							        data: d.man,
							        type: 'bar'
							    }
							  ]
							}
							TiaoXiang.setOption(lineOption)
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});

				mui.ajax(http + '/api/read/book/list_1',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){

						if (data.code == 200) {

							var d= data.data;

							var lineOption = {
							    color:["#62aa4c"],
							    legend:{
							        data:['每月阅读书籍数量'],
							        left: 'center',
							    },
							    xAxis: {
							        splitLine: {
							            show: true
							        },
							        type: 'category',
							        data: d.name
							    },
							    yAxis: {
							        min: 0,
							        type: 'value'
							    },
							    series: [{
							        name:'每月阅读书籍数量',
							        data: d.value,
							        type: 'line'
							    }]
							}

							ZeiXian.setOption(lineOption)
						}

					},
					error:function(xhr,type,errorThrown){

					}
				});

				mui.ajax(http + '/api/read/book/list/type_1',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){

						if (data.code == 200) {

							var d = data.data;

							BingBing = [];

							for (var i = 0 ; i < d.name.length ; i++) {

								BingBing.push({
									                value: d.count[i],
									                name: d.name[i]
								})

							}

							var pieOption = {
							    color:['#69aa8d','#4693aa','#6b63aa','#7534aa','#aa5274','#aa1027'],
							    tooltip: {
							        trigger: 'item'
							    },
							    legend: {
							        bottom: '0',
							        left: 'center',
							        icon:'circle',
							        data:d.name
							    },
							    series: [{
							        type: 'pie',
							        radius: '45%',
							        label: {
							            normal: {
							                show: true,
							                formatter: '{b}{d}%',
							            }
							        },
							        data:BingBing

							    }]
							}

							Bing.setOption(pieOption)

						}

					},
					error:function(xhr,type,errorThrown){

					}
				});

			})
		</script>
	</body>

</html>
