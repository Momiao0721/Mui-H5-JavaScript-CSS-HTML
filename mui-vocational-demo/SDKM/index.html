<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<h4 class="mui-title">时代楷模</h4>
	</header>
	
	
	<div class="mui-content">
		
		<div style="padding: 10px;" id="">
			
				<input style="border-radius: 30px;" id="username" type="text" class="mui-input-clear" placeholder="请输入">
				
				<input style="border-radius: 30px;" id="password" type="text" class="mui-input-clear" placeholder="请输入">
				
				<div id="but" style="padding: 5px;">
				<button id="butt" style="border-radius: 30px;" type="button" class="mui-btn mui-btn-red mui-btn-block">按钮</button>
				</div>
		</div>
				
				
	</div>
	<script src="js/http.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			mui('#but').on('tap','#butt',function(){

				var username = document.getElementById('username').value;
				var password = document.getElementById('password').value;

				if (username == '' || password == '') {
					mui.toast('账号/密码不能为空')
				}else{
					mui.ajax(http + '/api/login',{
						data:{
							username:username,
							password:password
						},
						headers:{
							'Content-Type':'application/json'
						},

						dataType:'json',
						type:'post',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {
								mui.toast('欢迎' + username + '登陆成功')
								localStorage.setItem('token',data.token)
								mui.openWindow({
									url:'./exe/page.html'
								})
							} else{
								mui.toast('账号/密码错误')
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});
				}

			})

		})
    </script>
</body>
</html>
