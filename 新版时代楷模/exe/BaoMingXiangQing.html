<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">活动报名</h1>
		</header>
		<div class="mui-content" id="BaoMing">

			

		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function LieBNiaoLISt(){

					mui.ajax(http + '/api/public/projects/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {
								var BaoMIngXiangHTML = '';

								for (var i = 0 ; i < data.rows.length ; i++) {

								var isSubmit = data. rows [i]. isSubmitPlan == 1 ? '是' : '不是' ;
									BaoMIngXiangHTML += `<div style="padding: 7px;">

				<div style="padding: 8px; background-color: #0062CC; border-radius: 30px;">
					<img src="${httpimg + data.rows[i].imgUrl}" style="height: 150px; width: 100%; border-radius: 30px;">

					<div style="padding: 4px;">

						<h4>${data.rows[i].projectTitle}</h4>
						<h5 style="color: #000000;">上线天数:${data.rows[i].onLineDay}</h5>
						<h5 style="color: #000000;">反馈次数:${data.rows[i].feedbackNum}</h5>
						<h5 style="color: #000000;">简要介绍:${data.rows[i].introduce}</h5>
					</div>
					<hr >
					<div style="position: relative;">
						<button BaoMingID="${data.rows[i].id}" type="button" class="mui-media mui-btn mui-btn-red" style="position: absolute; right: 2%; border-radius: 30px;">查看详情</button>
						<p style="color: #000000;">是否执行:${isSubmit}</p>
					</div>
				</div>
			</div>

			<br>`

								}
								document.getElementById('BaoMing').innerHTML = BaoMIngXiangHTML

								var CaiKanXiangQingList = document.querySelectorAll('#BaoMing .mui-media')

								for (var j = 0 ; j < CaiKanXiangQingList.length ;j++) {

								(function(XiangQingYei){

									XiangQingYei.addEventListener('tap',function(){

										var id = this.getAttribute('BaoMingID')

										console.log(id);

										plus.storage.setItem('BaoMingID',id);

										mui.openWindow('CaiKanXiangQing.html',{
											extras:{
												id:id
											}

										})

									})

								})(CaiKanXiangQingList[j])

								}
							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				LieBNiaoLISt()
			})
		</script>
	</body>

</html>
