<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
	<header class="mui-bar mui-bar-nav">
		<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
		<h1 class="mui-title">我的信息</h1>
	</header>
	<div class="mui-content">
		
		<div style="padding: 5px;" id="">
			
			<ul class="mui-table-view" style="border-radius: 10px;" id="Me">
				
				
				
			</ul>
			
		</div>
		
	</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function WoDeXiangXi(){

					mui.ajax(http + '/api/common/user/getInfo',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {
								var YongHuHTML = '';

								var PanDuan = data.data.educationBackground;

								var education;

								if (PanDuan == 0) {
									education = '未知'
								} else if(PanDuan == 1){
									education = '高中'
								}else if(PanDuan == 2){
									education = '大专'
								}else if(PanDuan == 3){
									education = '本科'
								}else if(PanDuan == 4){
									education = '硕士研究生'
								}else if(PanDuan == 5){
									education = '博士研究生'
								}

								console.log('education =', education);

								var PanDuan = education

								YongHuHTML += `<li class="mui-table-view-cell mui-media">
					<a href="javascript:;">
						<img class="mui-media-object mui-pull-left" src="${httpimg + data.data.avatar}">
						<div class="mui-media-body">
							<h4>用户名:${data.data.userName}</h4>
							<p class="mui-ellipsis">昵称:${data.data.nickName}</p>
						</div>
					</a>
				</li>

				<ul class="mui-table-view">
						<li class="mui-table-view-cell">
								用户id:${data.data.userId}
						</li>
						<li class="mui-table-view-cell">
								手机号:${data.data.phonenumber}
						</li>
						<li class="mui-table-view-cell">
								性别:${data.data.sex}
						</li>
						<li class="mui-table-view-cell">
								手机号:${data.data.phonenumber}
						</li>

						<li class="mui-table-view-cell">
									电子邮箱:${data.data.email}
						</li>
						<li class="mui-table-view-cell">
								证件号:${data.data.idCard}
						</li>
						<li class="mui-table-view-cell">
								教育背景:${PanDuan}
						</li>
					</ul>`
								document.getElementById('Me').innerHTML = YongHuHTML
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				WoDeXiangXi()
			})
		</script>
	</body>

</html>
