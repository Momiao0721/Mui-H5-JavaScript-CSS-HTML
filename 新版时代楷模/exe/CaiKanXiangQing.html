<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav" id="DingBu">
			
			
		</header>
		
		<div class="mui-content">
			
			<div style="padding: 6px;" id="XiangQQQing">
				
			</div>
			
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extras = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('BaoMingID') || extra.id

				console.log(id)

				function DiengBuHTML(){

					mui.ajax(http + '/api/public/projects/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {

								var XiangQingHao = ''
								var XiangQingQQQ = ''
								var isSubmit = data. data. isSubmitPlan == 1 ? '是' : '不是' ;
								XiangQingHao += `
								<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
								<h1 class="mui-title">${data.data.projectTitle}</h1>`

								XiangQingQQQ += `<div style="padding: 7px;">

				<div style="padding: 8px; background-color: #0062CC; border-radius: 30px;">
					<img src="${httpimg + data.data.imgUrl}" style="height: 150px; width: 100%; border-radius: 30px;">

					<div style="padding: 4px;">

						<h4>${data.data.projectTitle}</h4>
						<h5 style="color: #000000;">上线天数:${data.data.onLineDay}</h5>
						<h5 style="color: #000000;">反馈次数:${data.data.feedbackNum}</h5>
						<h5 style="color: #000000;">简要介绍:${data.data.introduce}</h5>
					</div>
					<hr >
					<div style="position: relative;">

						<p style="color: #000000;">是否执行:${isSubmit}</p>
					</div>
				</div>
			</div>`
								document.getElementById('DingBu').innerHTML = XiangQingHao
								document.getElementById('XiangQQQing').innerHTML = XiangQingQQQ
							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				DiengBuHTML()

			})
		</script>
	</body>

</html>
