<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">注册账号</h1>
		</header>
		<div class="mui-content">
			
			<h4 style="color: #007AFF;">注册账号</h4>
			
			<div style="padding: 10px;">
						
						<input type="text" class="mui-input-clear" id="Zanghao" placeholder="请输入你要更改的账号">
						
						<input type="text" class="mui-input-clear" id="MiMai" placeholder="请输入新的密码">
							
							
						<input type="text" class="mui-input-clear" id="SjiHao" placeholder="请输入手机号">
						
						<div id="">
						<input type="text" class="mui-input-clear" style="width: 180px;" id="YanZengmai" placeholder="请输入验证码">
						<button id="YanZhengMai" type="button" class="mui-btn mui-btn-blue" style="width: 40%; position: absolute;right: 10px;">获取验证码</button>
						</div>
						
						
						<div id="">
							<button type="button" id="QueiDing" class="mui-btn mui-btn-blue mui-btn-block">确定注册</button>
						</div>
						
			</div>
			
		</div>
		<script src="js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				document.getElementById('YanZhengMai').addEventListener('tap',function(){
					this.getAttribute('disabled','disabled')
					this.classList.add('mui-disabled')
					mui.toast('获取成功,注意手机验证码')
				})

				document.getElementById('QueiDing').addEventListener('tap',function(){

					var Zanghao = document.getElementById('Zanghao').value;
					var MiMai = document.getElementById('MiMai').value;
					var SjiHao = document.getElementById('SjiHao').value;
					var YanZengmai = document.getElementById('YanZengmai').value;

					if(Zanghao == '' || MiMai == '' || SjiHao == '' || YanZengmai ==''){
						mui.toast('不得为空')
					}else{

					mui.toast('注册成功')
					mui.back()

					}

				})

			})
		</script>
	</body>

</html>
