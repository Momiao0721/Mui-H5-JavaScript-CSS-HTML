	<body>

								<a class="mui-navigate-right">
									积分记录

		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function WoDE(){

					mui.ajax(http + '/api/common/user/getInfo',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){
							if (data.code == 200) {

								var WodE = ''

								WodE += `<div style="padding: 10px; background-color: #71d9ca; border-radius: 20px;">
					<div id="" style="position: absolute; left: 30%;">
						<h4>${data.data.userName}</h4>
						<h6 style="color: #000000;">${data.data.nickName}</h6>
					</div>
					<img src="${httpimg + data.data.avatar}" style="height: 80px; width: 80px; border-radius: 50px;">

					<div id="">

						<ul class="mui-table-view mui-grid-view mui-grid-9">
						<li class="mui-table-view-cell mui-col-xs-4">
							<a href="#">
								<h3>没有API</h3>

								<div class="mui-media-body">回收次数</div>
							</a>
						</li>
						<li class="mui-table-view-cell mui-col-xs-4">
							<a href="#">
								<h3>没有API</h3>

								<div class="mui-media-body">回收次数</div>
							</a>
						</li>
						<li class="mui-table-view-cell mui-col-xs-4">
							<a href="#">
								<h3>没有API</h3>

								<div class="mui-media-body">积分</div>
							</a>
						</li>

							</ul>

					</div>

				</div>`

				document.getElementById('WOde').innerHTML = WodE

							}
						},
						error:function(xhr,type,errorThrown){

						}
					});

				}
				WoDE()
			})
		</script>
	</body>

</html>
